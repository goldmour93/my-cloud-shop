# Browser-only Azure Function deployment, using GitHub Actions and OIDC.
# Azure Portal > python-function-cs > Deployment Center can set up the identity.
name: Deploy Starbound Python Function (Azure Portal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-python-function:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python for tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python source and unit tests
        run: |
          python -m compileall -q python-function
          python -m unittest discover -s python-function/tests -v

      # Flex Consumption is configured with Python 3.15 in Azure.
      # Test dependencies with that same version before using Azure credits.
      - name: Set up Python 3.15 (matches Azure Flex runtime)
        if: vars.AZURE_FUNCTIONS_PLAN == 'flexconsumption'
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Verify Python 3.15 dependencies and discover Function routes
        if: vars.AZURE_FUNCTIONS_PLAN == 'flexconsumption'
        run: |
          python --version
          python -m pip install --disable-pip-version-check -r python-function/requirements.txt
          python -m unittest discover -s python-function/tests -v
          PYTHONPATH=python-function python -c "from function_app import app; assert app is not None; print('Python 3.15 Azure Functions app imports successfully')"

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # For Flex Consumption set GitHub Actions variable:
      # AZURE_FUNCTIONS_PLAN=flexconsumption
      - name: Publish to Flex Consumption
        if: vars.AZURE_FUNCTIONS_PLAN == 'flexconsumption'
        uses: Azure/functions-action@v1
        with:
          app-name: python-function-cs
          package: python-function
          remote-build: true
          respect-funcignore: true

      - name: Publish to Consumption, Premium or Dedicated
        if: vars.AZURE_FUNCTIONS_PLAN != 'flexconsumption'
        uses: Azure/functions-action@v1
        with:
          app-name: python-function-cs
          package: python-function
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          respect-funcignore: true
